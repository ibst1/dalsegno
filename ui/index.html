<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DalSegno Window Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tabs">
  <button class="tab active" data-tab="positions" id="tabBtnPositions"></button>
  <button class="tab" data-tab="windows" id="tabBtnWindows"></button>
  <button class="tab" data-tab="desktops" id="tabBtnDesktops"></button>
  <button class="tab" data-tab="settings" id="tabBtnSettings"></button>
</div>

<div id="main">

  <section id="tab-positions" class="tabpane active">
    <div class="pane-head">
      <label><span id="lblSetup"></span>&nbsp;<select id="setupSel"></select></label>
      <button id="btnAddRule" class="small"></button>
      <span class="spacer"></span>
      <button id="btnForgetSel" class="small" disabled></button>
      <button id="btnSaveAll" class="small"></button>
      <button id="btnApplyAll" class="small primary"></button>
    </div>
    <div class="tablewrap">
      <table id="posTable">
        <thead><tr>
          <th class="selcol"><input type="checkbox" id="selAllPos"></th>
          <th id="thWindow"></th><th id="thIdentity"></th>
          <th style="text-align:center" id="thActive"></th>
          <th id="thDesktop" class="deskcol"></th>
          <th style="text-align:right" id="thX">X</th>
          <th style="text-align:right" id="thY">Y</th>
          <th style="text-align:right" id="thWidth"></th>
          <th style="text-align:right" id="thHeight"></th>
          <th></th>
        </tr></thead>
        <tbody id="posBody"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-windows" class="tabpane">
    <div class="pane-head">
      <span class="hint" id="winsHint"></span>
      <span class="spacer"></span>
      <button id="btnRefresh" class="small"></button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th id="thProgram"></th><th id="thTitle"></th>
          <th id="thWinDesktop" class="deskcol"></th>
          <th id="thIdentity2"></th><th id="thSaved"></th><th></th>
        </tr></thead>
        <tbody id="winBody"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-desktops" class="tabpane">
    <div class="inner">
      <p class="help warn" id="dllNote" hidden></p>
      <h2 id="dhkH"></h2>
      <p class="help" id="dhkHelp"></p>
      <div id="dhkList"></div>
      <h2 id="prefixH"></h2>
      <p class="help" id="prefixHelp"></p>
      <div id="prefixList"></div>

      <h2 id="taskbarH"></h2>
      <label class="toggle"><input type="checkbox" id="tglNameInTray"> <span id="lblNameInTray"></span></label><br>
      <label class="toggle"><input type="checkbox" id="tglWheel"> <span id="lblWheel"></span></label>
      <p class="help" id="wheelHelp"></p>
      <label class="toggle"><input type="checkbox" id="tglArrows"> <span id="lblArrows"></span></label>
      <p class="help" id="arrowsHelp"></p>
    </div>
  </section>

  <section id="tab-settings" class="tabpane">
    <div class="inner">
      <h2 id="modulesH"></h2>
      <p class="help" id="modulesHelp"></p>
      <label class="toggle"><input type="checkbox" id="tglModPositions"> <span id="lblModPositions"></span></label><br>
      <label class="toggle"><input type="checkbox" id="tglModDesktops"> <span id="lblModDesktops"></span></label>

      <h2 id="menuH"></h2>
      <p class="help" id="menuHelp"></p>
      <label class="toggle"><input type="checkbox" id="tglMenuOn"> <span id="lblMenuOn"></span></label>
      <div class="field">
        <label><span id="lblMenuModifier"></span> <input id="inMenuModifier" class="short"></label>
        <label><span id="lblMenuButton"></span> <input id="inMenuButton" class="short"></label>
      </div>
      <label class="toggle"><input type="checkbox" id="tglMenuWhole"> <span id="lblMenuWhole"></span></label>
      <p class="help" id="menuWholeHelp"></p>
      <div class="field"><label><span id="lblMenuExclude"></span> <input id="inMenuExclude" class="wide"></label></div>
      <p class="help" id="menuExcludeHelp"></p>

      <h2 id="behaveH"></h2>
      <label class="toggle"><input type="checkbox" id="tglMove"> <span id="lblMove"></span></label><br>
      <label class="toggle"><input type="checkbox" id="tglSave"> <span id="lblSave"></span></label><br>
      <label class="toggle"><input type="checkbox" id="tglModOnly"> <span id="lblModOnly"></span></label>
      <p class="help" id="modOnlyHelp"></p>
      <label class="toggle"><input type="checkbox" id="tglNotify"> <span id="lblNotify"></span></label>

      <h2 id="managedH"></h2>
      <label class="toggle"><input type="checkbox" id="tglOnlyRules"> <span id="lblOnlyRules"></span></label>
      <p class="help" id="onlyRulesHelp"></p>
      <h3 id="onlyRulesExeH"></h3>
      <p class="help" id="onlyRulesExeHelp"></p>
      <div class="ignore-grid"><div>
        <textarea id="txtRulesOnlyExe" spellcheck="false" placeholder="msedge.exe"></textarea>
      </div></div>
      <h3 id="ignoreH"></h3>
      <div class="ignore-grid">
        <div>
          <p class="help" id="ignExeHelp"></p>
          <textarea id="txtIgnoreExe" spellcheck="false" placeholder="mstsc.exe"></textarea>
        </div>
        <div>
          <p class="help" id="ignTitleHelp"></p>
          <textarea id="txtIgnoreTitle" spellcheck="false" placeholder="Bildfönster"></textarea>
        </div>
      </div>
      <p class="help" id="managedSavedHint"></p>

      <h2 id="hkH"></h2>
      <p class="help" id="hkHelp"></p>
      <div id="hkList"></div>

      <h2 id="langH"></h2>
      <p class="help" id="langHelp"></p>
      <label class="radio"><input type="radio" name="lang" value="en"> English</label>
      <label class="radio"><input type="radio" name="lang" value="sv"> Svenska</label>

      <h2 id="filesH"></h2>
      <p>
        <button id="btnOpenPositions" class="small"></button>
        <button id="btnOpenConfig" class="small"></button>
        <button id="btnReload" class="small"></button>
      </p>
    </div>
  </section>

</div>

<div id="statusbar"><span id="status"></span><span class="spacer"></span><span id="statusPause"></span></div>

<script src="app.js"></script>
</body>
</html>
